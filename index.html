
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Long Vacation: Maximum Shiok, Minimum Stress</title>
    <link rel="icon" type="image/png" href="/images/company-logo.png" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,200..1000&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Nunito Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                teal: '#0b4f4a',
                navy: '#0A1A2F',
                green: '#A3E635',
                coral: '#FF796C',
                white: '#FFFFFF',
                sand: '#F4EDE4'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Nunito Sans', sans-serif;
        background-color: #FFFFFF;
        /* Prevent Google Translate from pushing body down */
        top: 0px !important; 
        position: static !important; 
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Hide Google Translate Toolbar & Tooltips */
      .goog-te-banner-frame.skiptranslate {
        display: none !important;
      }
      .goog-te-gadget-icon {
        display: none !important;
      }
      #google_translate_element {
        display: none !important;
      }
      .goog-tooltip {
        display: none !important;
      }
      .goog-te-gadget-simple {
        display: none !important;
      }
      /* Hide the specific google banner frame that sometimes appears */
      iframe.goog-te-banner-frame {
        display: none !important;
      }
      
      /* Ensure our content doesn't get pushed */
      html {
        height: 100%;
      }
      body {
        min-height: 100%;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    
    <!-- Hidden Google Translate Element -->
    <div id="google_translate_element"></div>

    <!-- Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,zh-CN',
          autoDisplay: false,
          layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
